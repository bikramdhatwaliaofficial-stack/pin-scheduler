name: AI news auto post

on:
  schedule:
    - cron: "17 2 * * *"    # 07:47 IST
    - cron: "17 6 * * *"    # 11:47 IST
    - cron: "17 10 * * *"   # 15:47 IST
    - cron: "17 13 * * *"   # 18:47 IST
  workflow_dispatch:
    inputs:
      draft:
        description: "Create as draft (test)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: repo-commits

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write and publish AI article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || 'false' }}
        run: python scripts/ai_news.py
      - name: Save history
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add stories/ai_history.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Add published AI article to history" && git pull --rebase && git push)
